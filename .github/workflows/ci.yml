name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# TrainKraft builds against a composite build: settings.gradle.kts does
# includeBuild("../kraft-foundation"), so the foundation repo must exist as
# a SIBLING directory. Both checkouts below therefore use explicit `path`s
# that place trainkraft/ and kraft-foundation/ side by side in the workspace.
defaults:
  run:
    working-directory: trainkraft

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TrainKraft
        uses: actions/checkout@v4
        with:
          path: trainkraft

      # kraft-foundation is public, so no credentials are needed — the
      # default GITHUB_TOKEN can clone it unauthenticated. This replaced a
      # read-only deploy key (secret KRAFT_UI_DEPLOY_KEY) that existed only
      # because the library used to be private. Nine apps would have meant
      # nine such keys; the repository being public means zero.
      - name: Checkout kraft-foundation (composite-build sibling)
        uses: actions/checkout@v4
        with:
          repository: kedharsairam/kraft-foundation
          path: kraft-foundation

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # `quality.ci-runs-the-gate` fails if this step is removed. `../` because
      # working-directory above is trainkraft/, and the foundation is a sibling
      # of that directory rather than a child of it.
      - name: Quality gate
        run: node ../kraft-foundation/tools/kraft-lint/kraft-lint.js . --format github

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon
