name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-runs (build only — the release step below is tag-gated, so a
  # dispatch never creates a release).
  workflow_dispatch:

# Same composite-build constraint as ci.yml: settings.gradle.kts does
# includeBuild("../kraft-ui"), so kraft-ui must sit beside trainkraft/.
# NOTE: softprops/action-gh-release `files` globs resolve against the
# workspace root (not this working-directory), hence the trainkraft/ prefix.
defaults:
  run:
    working-directory: trainkraft

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout TrainKraft
        uses: actions/checkout@v4
        with:
          path: trainkraft

      # kraft-ui is private; GITHUB_TOKEN can't see it — same read-only
      # deploy key as ci.yml (secret KRAFT_UI_DEPLOY_KEY).
      - name: Checkout kraft-ui (composite-build sibling)
        uses: actions/checkout@v4
        with:
          repository: kedharsairam/kraft-ui
          path: kraft-ui
          ssh-key: ${{ secrets.KRAFT_UI_DEPLOY_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version tag
        id: rename
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/TrainKraft-${VERSION}.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TrainKraft ${{ github.ref_name }}
          body: |
            ## TrainKraft ${{ github.ref_name }}

            ### Install
            1. Download `TrainKraft-${{ steps.rename.outputs.version }}.apk`
            2. Open the file on your Android device
            3. Allow "Install from unknown sources" if prompted

            ### Notes
            - Release APK is signed with the debug keystore (installable).
            - Offline timetable bundled (10.5k trains).
          files: |
            trainkraft/app/build/outputs/apk/release/TrainKraft-*.apk
